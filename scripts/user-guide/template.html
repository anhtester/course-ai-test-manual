<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{TITLE}}">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2328;--muted:#59636e;--line:#d8dee4;--accent:#6d28d9;--accent-bg:#ede9fe;--code:#f1f3f5;
--tip:#eef6ff;--tipl:#3b82f6;--cau:#fff4e5;--caul:#f59e0b;--warn:#fdecec;--warnl:#dc2626;--note:#f3f4f6;--notel:#9ca3af;--th:#f3f4f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--ink:#e6e8eb;--muted:#9aa4af;--line:#2a2f3a;--accent:#a78bfa;--accent-bg:#2a2340;--code:#222733;
--tip:#12233d;--cau:#33260e;--warn:#3a1515;--note:#1f232b;--th:#1f232b}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--ink:#e6e8eb;--muted:#9aa4af;--line:#2a2f3a;--accent:#a78bfa;--accent-bg:#2a2340;--code:#222733;
--tip:#12233d;--cau:#33260e;--warn:#3a1515;--note:#1f232b;--th:#1f232b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1400px;margin:0 auto}
nav.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line)}
nav.toc .brand{font-weight:700;font-size:13px;margin:0 8px 12px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
nav.toc a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
nav.toc a.lvl3{padding-left:22px;color:var(--muted);font-size:12.5px}
nav.toc a:hover,nav.toc a.active{background:var(--accent-bg);color:var(--accent)}
main{padding:28px 44px 90px;min-width:0;max-width:1000px}
h1{font-size:26px;line-height:1.3;margin:0 0 18px}
h2{font-size:21px;margin:44px 0 12px;padding-top:12px;border-top:2px solid var(--line)}
h3{font-size:17.5px;margin:30px 0 10px;color:var(--accent)}
a{color:var(--accent)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:12.5px/1.4 Consolas,monospace}
ol,ul{padding-left:26px}li{margin:6px 0}li>ul{margin-top:4px}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:14px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--th)}
.callout{margin:12px 0;padding:10px 14px;border-left:4px solid var(--notel);background:var(--note);border-radius:0 8px 8px 0}
.callout p{margin:4px 0}
.callout.tip{border-color:var(--tipl);background:var(--tip)}
.callout.caution{border-color:var(--caul);background:var(--cau)}
.callout.warning,.callout.danger{border-color:var(--warnl);background:var(--warn)}
figure{margin:10px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:760px}
figure img{display:block;width:100%;height:auto;border-radius:4px;cursor:zoom-in}
figure.vid{max-width:960px}figure video{display:block;width:100%;border-radius:4px;background:#000}
figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
img.thumb{display:block;width:160px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;background:#fff}
img.thumb:hover{outline:2px solid #7c3aed}
video.vmini{display:block;width:220px;max-width:100%;border-radius:4px}
.xref{border-bottom:1px dotted var(--muted);cursor:help}
#themeBtn{position:fixed;top:12px;right:14px;z-index:5;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:10;overflow:auto}
#lb.open{display:block}
#lb .stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 60px 70px}
#lb img{max-width:100%;max-height:calc(100vh - 130px);cursor:zoom-in;background:#fff}
#lb.zoom .stage{display:block}#lb.zoom img{max-width:none;max-height:none;cursor:zoom-out}
#lb .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;color:#eee;font-size:13.5px;background:rgba(0,0,0,.6);text-align:center}
#lb button{position:fixed;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;font-size:22px;width:44px;height:44px;cursor:pointer}
#lb .prev{left:10px;top:50%}#lb .next{right:10px;top:50%}#lb .close{right:10px;top:10px}
@media (max-width:900px){.layout{display:block}nav.toc{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px 60px}#lb .stage{padding:56px 8px 70px}}
</style></head>
<body>
<button id="themeBtn" type="button" aria-label="{{THEME}}">◐</button>
<div class="layout">
<nav class="toc"><div class="brand">{{TOC_TITLE}}</div>{{TOC}}</nav>
<main>{{BODY}}</main>
</div>
<div id="lb" role="dialog" aria-label="{{VIEWER}}">
  <div class="stage"><img alt=""></div>
  <button class="close" aria-label="{{CLOSE}}">×</button><button class="prev" aria-label="{{PREV}}">‹</button><button class="next" aria-label="{{NEXT}}">›</button>
  <div class="bar"></div>
</div>
<!--ASSETS-->
<script>
var T={{JS_I18N}};
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  try{var t=localStorage.getItem('ug-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
  btn.onclick=function(){var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var n=dark?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('ug-theme',n);}catch(e){}};
  var imgs=[].slice.call(document.querySelectorAll('main figure img, main img.thumb')), lb=document.getElementById('lb'),
      big=lb.querySelector('img'), bar=lb.querySelector('.bar'), i=0;
  function show(k){i=(k+imgs.length)%imgs.length;big.src=imgs[i].src;lb.classList.remove('zoom');
    bar.textContent=(i+1)+' / '+imgs.length+' — '+imgs[i].alt+'   ·   '+T.hint;lb.classList.add('open');}
  imgs.forEach(function(im,k){im.onclick=function(){show(k)};});
  big.onclick=function(e){e.stopPropagation();lb.classList.toggle('zoom');};
  lb.querySelector('.prev').onclick=function(e){e.stopPropagation();show(i-1)};
  lb.querySelector('.next').onclick=function(e){e.stopPropagation();show(i+1)};
  lb.querySelector('.close').onclick=function(){lb.classList.remove('open')};
  lb.onclick=function(e){if(e.target===lb||e.target.classList.contains('stage'))lb.classList.remove('open')};
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);});
  var links=[].slice.call(document.querySelectorAll('nav.toc a'));
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id)});}});},{rootMargin:'0px 0px -75% 0px'});
  document.querySelectorAll('main h2[id],main h3[id]').forEach(function(h){io.observe(h)});
})();
</script>
</body></html>
