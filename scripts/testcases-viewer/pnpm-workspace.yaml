# Các package có install script chứa native binding. Đặt false vì Parcel/SWC dùng prebuilt
# binary sẵn có — build lại không cần thiết và hay hỏng trên Windows khi thiếu build tools.
# Không khai báo ở đây thì mọi lệnh `pnpm run` đều fail với ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  lmdb: false
  msgpackr-extract: false
